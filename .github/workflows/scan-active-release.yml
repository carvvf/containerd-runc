name: Active release status
run-name: Daily containerd and runc rebuild scan

on:
  schedule:
    # UTC schedule; Europe/Rome: 03:27 CET / 04:27 CEST.
    - cron: '27 2 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when inputs, revision and the active scan are unchanged
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  scan-and-rebuild:
    uses: ./.github/workflows/ci.yml
    with:
      force_rebuild: ${{ inputs.force_rebuild || false }}
