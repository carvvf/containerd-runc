name: Renovate
run-name: >-
  ${{ github.event_name == 'issues' && 'Renovate after a Dependency Dashboard edit'
  || 'Renovate dependency updates' }}

# Opens or refreshes one cumulative pull request with the updates the image workflows do not
# move on their own, and keeps the Dependency Dashboard issue that lists the reviewed changes
# awaiting approval (see renovate.json5). Renovate acts as a GitHub App, so its pull requests
# trigger this repository's workflows like any other, and it may update workflow files.
# The App is installed on this repository with these repository permissions: contents, issues,
# pull requests and workflows read and write; checks and commit statuses read; metadata read.
# Besides the weekly and the manual runs, a person's edit of the Dependency Dashboard (ticking
# an approval or a retry box) starts a run at once. Only collaborators with write access can
# edit an issue the App opened.
on:
  schedule:
    # UTC schedule; Europe/Rome: Monday 00:47 CET / 01:47 CEST.
    - cron: '47 23 * * 0'
  workflow_dispatch:
    inputs:
      log_level:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - info
          - debug
  issues:
    types: [edited]

permissions:
  contents: read

concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    # Issue edits count only on the dashboard and only by a person: Renovate rewrites the
    # dashboard on every run, and edits made with an App token start workflows, so its own
    # edits would loop.
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.title == 'Dependency Dashboard' &&
      github.event.issue.user.login == 'ragtime-renovate[bot]' &&
      github.event.sender.type != 'Bot')
    runs-on: ubuntu-latest
    # Renovate clones the repository itself with the App token; no checkout is needed.
    steps:
      - name: Create a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@7b402fe76b7bc4273576663a09be2f0f85266e2f # v47.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 45.1.1
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The repository configuration already exists; no onboarding pull request.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits created through the API are signed by GitHub as the App.
          RENOVATE_PLATFORM_COMMIT: enabled
