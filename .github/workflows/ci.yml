name: Build, scan and publish
run-name: containerd and runc qualification

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:
    inputs:
      force_rebuild:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild even when inputs, revision and the active scan are unchanged
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check resolver, module, scan, release and retention decisions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check shell scripts
        run: |
          bash -n tests/smoke-cri.sh
          bash -n scripts/trivy/resolve-version.sh
          bash -n docker/apply-module-overrides.sh
          sh -n docker/retry.sh
          docker run --rm --entrypoint shellcheck -v "$PWD:/workspace:ro" -w /workspace \
            koalaman/shellcheck-alpine:v0.10.0 --shell=bash -x \
            tests/smoke-cri.sh scripts/trivy/resolve-version.sh docker/apply-module-overrides.sh
          docker run --rm --entrypoint shellcheck -v "$PWD:/workspace:ro" -w /workspace \
            koalaman/shellcheck-alpine:v0.10.0 --shell=sh docker/retry.sh
      - name: Check Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:v2.14.0 < docker/containerd/Dockerfile
          docker run --rm -i hadolint/hadolint:v2.14.0 < docker/runc/Dockerfile
      - name: Check GitHub Actions workflows
        run: docker run --rm --entrypoint actionlint -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color

  candidate:
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and qualify both components without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m tools.pipeline check --component all
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-evidence-${{ github.run_id }}
          path: |
            build/*/inputs.json
            build/*/build.json
            build/*/trivy-*.json
            build/*/upstream-tests.log
            build/*/out/go.mod.diff
            build/smoke*.log
          retention-days: 14

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      # containerd first, so the runc smoke test pairs with the newest containerd release.
      max-parallel: 1
      fail-fast: false
      matrix:
        component: [containerd, runc]
    concurrency:
      group: containerd-runc-publication
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve, qualify and stage a release when required
        id: pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          args=(--component "$COMPONENT")
          if [ "$FORCE_REBUILD" = true ]; then args+=(--force-rebuild); fi
          python3 -m tools.pipeline auto "${args[@]}"
      - name: Attest the staged release assets
        if: steps.pipeline.outputs.staged == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pipeline.outputs.assets }}/*
      - name: Publish the staged release
        if: steps.pipeline.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ matrix.component }}
        run: python3 -m tools.release finalize --component "$COMPONENT"
      - name: Retain qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-evidence-${{ matrix.component }}-${{ github.run_id }}
          path: |
            build/*/inputs.json
            build/*/build.json
            build/*/trivy-*.json
            build/*/upstream-tests.log
            build/*/out/go.mod.diff
            build/*/smoke*.log
            build/*/staged-release.json
          retention-days: 14

  # ci.yml also runs from the daily scan; the configuration only changes in pull requests.
  renovate-config:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the Renovate configuration with the release renovate.yml runs
        run: |
          set -euo pipefail

          # renovate.yml holds the only copy of the release, which Renovate itself updates.
          versions="$(sed -nE 's/^[[:space:]]*renovate-version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/p' .github/workflows/renovate.yml)"
          if [ "$(printf '%s\n' "${versions}" | grep -c .)" -ne 1 ]; then
            echo "Expected exactly one renovate-version X.Y.Z in .github/workflows/renovate.yml, found: ${versions:-none}." >&2
            exit 1
          fi
          echo "- Renovate release: ${versions}" >> "$GITHUB_STEP_SUMMARY"

          # --strict also fails on a configuration that this release would migrate.
          docker run --rm \
            -v "${PWD}:/usr/src/app:ro" \
            -w /usr/src/app \
            --entrypoint renovate-config-validator \
            "ghcr.io/renovatebot/renovate:${versions}" \
            --strict
